# Japanese Animal Names: source-of-truth name catalogue.
#
# Edit a MOD pool's `names` list, then run:
#   powershell -ExecutionPolicy Bypass -File tools\Build-JapaneseAnimalNamesCatalog.ps1
#
# `source = "vanilla"` pools are a read-only reference copied from the game's
# ranching/misc.toml. They are deliberately never added by this MOD.

catalog_version = 1

[[pool]]
id = 1
source = "mod"
sex = "shared"
category = "pet_style"
enabled_by_default = true
